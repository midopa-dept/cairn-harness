kind: task
schema_version: 3
id: task-example
objective: 현재 사용자 요청의 목적을 입력한다.
# 복사 후 distribution.yaml의 content_id를 채운다. 예시를 직접 실행하지 않는다.
harness_snapshot: null
workflow:
  graph: standard-change
  node: admit
  role: coordinator
  # runtime.family는 실행 runtime(예: codex, claude_code). 권장 id 형식은 <runtime>-<task>-<role>.
  actor: {id: local-agent, kind: agent, context: work-context, runtime: {family: unknown, version: null}}
  state: OPEN
scope:
  # 이 Task의 실제 사용자 위임 원문 위치와 내용. project.yaml에 누적하지 않는다.
  authorization: null
  read: []
  write: []
  allow: [read, record, plan]
  deny: []
  risk_tags: []
  risk_reason: null
  children: []
# 각 항목: id, requirement(의무 문장), check(관찰/검사 방법).
criteria: []
plan:
  identity: null
  summary: null
  artifacts: []
  # scope.children이 있는 분해 작업이면 Coverage Matrix sidecar의 manifest ID를 적는다.
  # sidecar는 kind coverage_matrix, task(이 Packet id), scope(artifact/revision/sections/basis),
  # obligations(local_id, source{artifact, excerpt, fingerprint}, disposition, 처분별 field)를 가진다.
  # 전체를 이 Packet에 복사하지 않는다. 의미는 core.yaml packet_semantics.coverage를 따른다.
  coverage_matrix: null
  # 필요 시 what / why / human_check / residual_risks를 채운다.
  review_brief: null
# 각 항목: id/path/revision/selector/kind; 선택 summary와 links.
# 날짜·시각·숫자처럼 보이는 문자열(revision 등)과 ': '가 들어간 문자열은 따옴표로 감싼다. YAML parser가 timestamp·숫자·mapping으로 읽을 수 있다.
# edge는 relation/to/source_selector이며 원본의 명시 참조만 도출한다.
artifacts: []
# 후보 준비 후 id/artifacts/producers를 채운다. producers는 actor 형식이다.
candidate: null
verification:
  verdict: not_run
  independence_required: false
  independence_reason: null
  # id/artifact/subject/criteria/availability/verdict/applicability.
  evidence: []
# kind/actor/role/subject/verdict/basis/independence. 실제 판단만 추가한다.
# human_gate에는 선택 gate_class(ambiguous_semantic·high_impact·scope_change)를 둔다.
# guard에 쓰지 않는 기록은 kind record와 subkind를 쓰고 verdict는 자유 텍스트다. kind를 빠뜨리지 않는다. 예:
# - {kind: record, subkind: handoff_reconciliation, actor: {id: codex-t1-executor, kind: agent, context: ..., runtime: {family: codex, version: null}},
#    role: executor, subject: t1-plan-v1, verdict: checkpoint 일치, basis: git status 관찰, independence: null}
decisions: []
delivery:
  required: false
  target: null
  receipt: null
  applicability: null
  # 각 항목: risk, owner, condition (+ 선택 id, owner_kind, owner_ref, due, inherited_from).
  # 종료하는 이 Task 자신을 owner로 두지 않는다. 문자열은 종료 인계로 인정되지 않는다.
  residual_risks: []
  # 이전 Task residual의 해소·대체·이전·수용: ref(<task>#<id>), status, to, basis. append만 한다.
  residual_dispositions: []
recovery:
  status: clear
  # 작업량·위임에 맞는 유한 상한. 비어 있으면 실행 전 계획에서 정한다.
  max_attempts: null
  # id/action/state/receipt. 중단·불명확한 시도를 삭제하거나 초기화하지 않는다.
  attempts: []
  reason: null
  resume_node: null
  # 중단·인계 지점의 최소 재개 상태: actor, base(Git commit), uncommitted, completed, remaining.
  checkpoint: null
# admit·recover·runtime 전환 때 append: actor, family, capabilities{이름: available|unavailable|gated|not_checked}, basis.
runtime_observations: []
# 새 evidence 출력이 있으면 root(<evidence_root>/<task id>)와 authoritative/supporting(manifest ID), raw(경로)를 채운다.
evidence_manifest: null
# 관찰한 값만. 모르면 null. evidence bytes 등 계산 가능한 값은 적지 않는다.
telemetry: {}
