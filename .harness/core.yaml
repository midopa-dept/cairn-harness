contract_version: 1
language: ko
# 이 파일의 key별 구획이 정본이다. 실행기나 표현식 평가 언어가 아니다.
constitution:
  authority: 권한은 역할·노드·작업 범위의 교집합이며 명시적 상향 판단 없이 확대하지 않는다.
  identity: 주장·판정은 식별 가능한 산출물·범위·기준·근거에 결합하고 변경 뒤 적용성을 설명한다.
  distinctions: VERIFIED·ACCEPTED·CLOSED와 상하위 인수는 자동 대체되지 않는다.
  independence: candidate를 생성·수정한 actor는 그 candidate의 acceptance actor가 될 수 없다. 독립 판단이 요구되면 추가로 생성자 판단 맥락과 분리한다.
  honesty: 미실행·불확실·근거 미확보를 PASS로 바꾸거나 원결과를 소급 변경하지 않는다.

authority:
  capabilities: [read, record, plan, edit, verify, review, accept, integrate]
  effective: 역할 allow ∩ 현재 노드 allow(하위 호출은 상위 노드와 subgraph allow의 교집합) ∩ scope.allow; 모든 deny와 경로 제한을 추가 적용한다.
  rules:
    - 미선언 기능은 금지한다. read 성공이나 설정 변경은 실행·전송 권한이 아니다.
    - record는 자기 Task Packet과 지정 근거 기록만 허용하며 다른 정본을 수정할 권한이 아니다.
    - edit/integrate/검사의 쓰기 효과는 scope.write의 대상에만, read는 scope.read의 대상에만 적용한다. 외부 전달 효과는 plan과 실제 위임에 대상·효과가 명시되어야 한다.
    - scope.authorization은 실제 사용자 위임의 위치와 내용이며 agent가 자기 권한을 생성할 수 없다.
    - producer의 역할 전환·context 변경·ID 재명명은 다른 acceptance actor를 만들지 않는다. 실제 actor 동일성을 확인하며 같은 모델을 쓰는 별도 actor는 허용한다.
    - 역할 특화는 하나의 base 역할 allow의 부분집합과 추가 deny만 허용한다. 노드/호출의 roles와 판정 역할 조건은 base로 대조하고 현재 role에는 실제 특화 ID를 기록한다. 다중 상속은 없다.
    - 프로젝트 설정은 gate와 제한을 추가할 수만 있다. Core 변경은 명시적 업데이트 작업이다.
    - 범위·기준·권한 변경은 계획 식별을 갱신하고 필요한 인간 판단을 거친다. 기존 금지를 조용히 제거하지 않는다.
  isolation:
    default: 역할별 필요한 읽기·쓰기·도구 범위를 제한한다.
    judgment: 생성자의 판단 맥락과 분리된 한정 맥락에서 필수 독립 판단을 한다.
    method: 새 세션을 기본으로 강제하지 않는다. 실제 가능한 맥락 필터·세션·작업 공간 분리 수단과 관찰 근거를 기록한다.
    failure: 요구한 경계를 런타임이 제공하지 못하면 영향 작업을 멈추고 상향 판단한다. prompt나 새 context ID만으로 격리를 입증하지 않는다.
  inherited_forbidden:
    - 사용자·독립 검토자의 승인/판정을 꾸며내기
    - 금지 경로·다른 작업자의 출력에 무단 쓰기
    - 실패·소비 이력 삭제 또는 한도 임의 초기화

roles:
  coordinator:
    purpose: 작업 접수·범위/위임 확인·분해·상위 결과 대조
    allow: [read, record, plan, accept]
    deny: [edit, integrate]
  specifier:
    purpose: 기존 요구사항의 작업 의무 구체화; 요구 변경은 인간 gate 대상
    allow: [read, record, plan, edit]
    deny: [accept, integrate]
  designer:
    purpose: 변경 설계와 영향 범위 구체화; 아키텍처 변경은 인간 gate 대상
    allow: [read, record, plan, edit]
    deny: [accept, integrate]
  planner:
    purpose: 범위·단계·검증·복구 한도 계획
    allow: [read, record, plan]
    deny: [edit, accept, integrate]
  executor:
    purpose: 승인 범위의 산출물 변경
    allow: [read, record, edit, verify]
    deny: [accept, integrate]
  verifier:
    purpose: 기준별 관찰·검사·적용성 보고
    allow: [read, record, verify]
    deny: [edit, accept, integrate]
  reviewer:
    purpose: 필요한 독립 판단과 위임된 인수
    allow: [read, record, review, accept]
    deny: [edit, integrate]
  integrator:
    purpose: 인수된 산출물의 허가된 전달·통합과 변경분 대조
    allow: [read, record, integrate]
    deny: [edit, accept]
  steward:
    purpose: 작업 종료 의무·현재 기록·명시적 snapshot 업데이트 준비
    allow: [read, record, plan]
    deny: [edit, accept, integrate]

states:
  lifecycle:
    OPEN: 작업 의무를 수행 중이거나 후보 변경으로 판단을 다시 준비한다.
    VERIFIED: 현재 후보의 필수 기준에 적용 가능한 적격 검증 근거가 있다. 인수는 아니다.
    ACCEPTED: 권한 있는 담당자의 현재 후보/범위 인수 결정이 있다. 종료는 아니다.
    CLOSED: 인수·전달·잔여 의무 인계·실행 정리가 그래프 조건을 충족했다.
  graph_progress: graph별 진행 상태는 workflow.node와 호출 단계로 표현하고 공통 lifecycle enum에 섞지 않는다.
  verification_verdicts: [not_run, pass, fail, inconclusive]
  evidence_availability: [available, unavailable]
  rules:
    - 하위 ACCEPTED는 상위의 입력이다. 상위 목표·후보·결합 영향·잔여 의무를 따로 대조한다.
    - 중단은 recovery.status에, 실행 시작/종료는 recovery.attempts에 기록한다. lifecycle과 혼합하지 않는다.
    - 변경 후 영향받은 현재 주장은 철회하고 OPEN에서 필요한 단계로 복귀한다. 원판정은 역사로 보존한다.
    - PASS 수량·프로세스 exit·commit·publish는 각각 인수/종료의 대체물이 아니다.

policies:
  acceptance: {exclude_candidate_producers: true}
  bootstrap:
    when: project.yaml의 핵심 설정이 비어 있고 활성 Task Packet이 없으며 사용자가 프로젝트 목표/요구를 제공했다.
    delegation: 현재 요청을 최초 setup 위임으로 기록한다. 저장소 상태를 먼저 읽고 admit에서 로컬 설정·bootstrap Packet만 준비한다. 기존 정보로 정해지는 값은 다시 묻지 않는다.
    scope: 같은 standard-change의 plan에서 문서 준비 범위/기준을 정하고 execute에서 프로젝트 목표·requirement baseline·핵심 사용자 흐름·필요한 초기 domain/data 개념과 검증 전략을 정본으로 준비한다. 최소 한 문서의 절로 합칠 수 있다.
    baseline: 기존 정본이 있으면 재사용·대조하며 덮지 않는다. 최초 요청에 명시된 requirement의 충실한 최초 기록은 사용자 권위의 기록이며 canonical_requirement 변경이 아니다. 이후 baseline 변경 또는 agent의 새로운 정본 requirement 추가는 기존 인간 gate 대상이다. 다른 고영향 gate는 면제하지 않는다.
    unknowns: 원요구·도출 가능한 내용·미결정 제안을 구분하고 출처를 남긴다. 실제 판단이 필요한 unresolved decision만 질문하며 미승인 제안을 정본 의무로 확정하지 않는다.
    handoff: 정본의 명시 참조에서 초기 manifest를 도출하고 첫 implementation Packet을 OPEN으로 준비한다. 공통 요구·architecture·security 등 governing 정본의 위치·ID/제목·짧은 적용 범위를 기존 정본의 목차/요약에 남겨 이후 context.applicability 점검이 가능하게 한다. 모든 문서에 edge를 미리 연결하거나 별도 registry를 만들지 않는다. 최초 준비 범위는 현재 요청과 기존 정본으로 대조하며 아직 만들지 않은 baseline을 존재한다고 기록하지 않는다. 후속 작업 참조로 연결하며 bootstrap의 완료를 기다리는 child로 만들지 않는다. 필요한 인간 결정은 해당 효과 전에 멈추고, bootstrap 자체도 검증·비producer 인수·종료를 거친다. setup 완료는 제품 구현 완료가 아니다.
  decision_questions:
    limit: 1
    format: 실제 미결정 판단/인간 gate에서는 한 번에 결정 질문 하나만 제시한다. 의미 있는 선택지 2~3개의 짧은 장단점, 추천안과 추천 이유를 함께 제공한다.
    reuse: 사용자 요구·정본 자료·승인된 결정에서 답이 자연스럽게 정해지면 재질문하지 않는다. 여러 질문을 묶지 않으며 답변 전에는 해당 결정에 의존하는 효과를 실행하지 않는다.
    exception: 단순 상태 보고나 명시적 승인 확인처럼 선택지가 무의미하면 억지로 만들지 않는다. 질문 형식 때문에 정본 requirement나 계획을 바꾸지 않는다.
  git_closeout:
    when: Git 저장소이며 현재 사용자 위임 또는 프로젝트 정책이 commit/push를 허용하고 정상 remote가 있고 현재 task scope 안의 변경만 존재한다. 이 조건을 충족하는 완료형 task의 기본 delivery 절차다.
    steps: [review_diff, confirm_verification_acceptance, commit_once, push_non_force, compare_local_remote_identity, confirm_clean, record_delivery_evidence]
    authority: 적용 조건을 확인한 계획에 delivery.required=true와 허가된 대상·근거 기록 방식을 둔다. 기존 integrator 역할·close 노드·Task 범위의 교집합을 유지한다. 조건 자체가 commit/push 권한을 부여하지 않는다. remote/branch 대상은 기존 설정·위임에서 확인한다.
    forbidden: force push, 예상 밖 원격 변경의 파괴적 reconciliation, scope 밖 변경 포함, 승인되지 않은 branch/history rewrite는 금지한다.
    incomplete: Git이 아니거나 위임/권한/remote가 없으면 제품 검증 실패로 바꾸지 않는다. delivery가 필요하면 미완료 조건을 기록하고 필요한 좁은 사용자 행동만 요청한다. 원격 거절이면 로컬 결과를 보존한다. 전달 불필요는 이유를 기록한다.
    evidence: 실제 commit/push 결과·로컬/원격 대상 identity·clean 관찰을 기존 작업/런타임 기록 또는 최종 보고에 남기고 delivery에 연결한다. 미래 성공을 미리 기록하지 않는다. 추적 Packet의 사후 수정으로 dirty가 되면 clean으로 주장하지 않으며 기록 방식은 close 계획에서 정한다.
  human_gate_tags: [architecture, authentication_security, db_migration, canonical_requirement, equivalent_high_impact]
  risk: 기존 승인 계약을 사용하는 것과 계약 자체를 바꾸는 것을 구분한다. tags 누락으로 실제 고영향 변경을 면제하지 않는다.
  independence_default: 고영향 변경 또는 프로젝트/작업이 요구한 검증·인수에는 독립 판단을 적용한다. 그 외에는 필수 독립 검토 단계를 추가하지 않아도 되지만 producer의 자기 인수 금지는 항상 적용한다.
  verification: context.applicability로 대조한 공통 의무를 포함해 공개 경로·관련 음성 조건·교차 영향을 골라 검증한다. 선택된 criteria의 PASS만으로 미해결 적용 의무를 덮지 않는다. 관련 없는 전수 감사나 고정 반복 횟수는 없다.
  scope_complete: 범위 전체 탐색을 맡았으면 첫 결함 뒤에도 안전한 독립 영역을 완료하거나 미검증 범위를 표시한다.
  escalation: 범위 밖 발견은 기록·인계한다. 필요한 위임·정책 판단만 질문하며 기존 유효 승인을 형식상 다시 요구하지 않는다.

# guard 이름은 아래 문장과 결합한 검사 계약이다. boolean을 적었다고 충족되는 것이 아니다.
guards:
  admitted: 프로젝트 이름·자료 루트·접근 경계와 작업 목적·기준·위임·역할·입력 참조가 유효하고 현재 snapshot이 일치한다. 필수 독립 판단에는 실제 판단 경계도 필요하다.
  plan_current: plan의 식별·범위·기준·효과·위험·유한 복구 한도를 자기검토했으며 변경 대상에 적용 가능하다. context.applicability의 bounded check를 수행해 적용 의무를 plan/criteria/manifest에 반영하고 제외 이유·미해결을 남겼다. 미해결 의무에 의존하는 범위의 계획 완전성은 확정하지 않으며 그 범위에는 이 guard가 성립하지 않는다. 독립 범위만 진행하려면 기존 범위/계획 변경 계약으로 명시적으로 좁힌다.
  gate_satisfied: policies.bootstrap.baseline의 최초 요구 기록 예외만 적용한 뒤 실제 영향에 맞는 baseline/추가 gate가 없거나 현재 plan.identity에 결합된 인간 승인과 위임 근거가 있다.
  candidate_ready: candidate.id와 비어 있지 않은 산출물 manifest 판본 집합 및 생성/수정 맥락을 실제로 식별했다.
  evidence_current: verification.verdict가 pass이며 모든 필수 criteria를 현재 후보에 결합된 available/pass 근거가 덮고 미해결 모순/실패가 없다. context.applicability에서 발견한 적용 의무도 포함하며 의존 범위에 미해결 의무가 있으면 성립하지 않는다. 재사용 근거는 영향 분석으로 적용성이 명시됐다.
  independent_satisfied: 검증 단계에 필요한 독립 검토가 적격 분리 맥락에서 이루어졌고 분리 근거가 있다. 인수자 독립성은 뒤의 accepted_current에서 따로 확인한다. baseline/프로젝트/작업 요구를 합집합으로 판단한다. false로 baseline을 면제하지 않으며 미요구이면 생략 이유를 verification에 둔다.
  parent_reconciled: scope.children이 없거나 모든 필요한 하위 인수·후보·연결 근거와 상위 결합 영향/잔여 의무를 확인했다.
  accepted_current: 현재 후보·범위·근거에 대한 권한 있는 acceptance 결정이 있고 policies.acceptance에 따라 acceptance.actor.id가 candidate.producers의 모든 actor.id와 다르며 실제 actor도 구분된다. 역할/context 변경은 면제가 아니다. 필요 인간 조건과 추가 bounded-context 독립성도 충족됐다. 적격 비producer reviewer는 같은 candidate의 acceptance까지 수행할 수 있다.
  delivery_current: delivery가 현재 인수 대상과 같거나 허용된 변경분/적용성을 설명하며 지정 전달 의무가 완료됐다.
  settled: 진행/불명확 실행이 없고 미해결 차단 의무가 없다. 잔여 위험과 후속 소유자를 인계했으며 다음 작업을 자동 시작하지 않는다.
  recoverable: 실행/효과를 대조했고 복귀 후 필요한 새 시도에 남은 한도·권한·필수 격리가 충분하다. 추가 실행이 없으면 한도 소진만으로 기존 적격 판정을 무효화하지 않는다. 사용자 중단이면 새 지시 전 복귀하지 않는다.

# 모든 노드는 authority와 context 계약을 적용한다. graph별 상태는 v1에서 추가하지 않는다.
graphs:
  standard-change:
    entry: admit
    nodes:
      admit:
        roles: [coordinator]
        allow: [read, record, plan]
        complete_when: [admitted]
        entry_states: [OPEN]
        next: [plan, execute, verify]
        skip: 기존 적용 가능한 계획은 plan을, 변경 없이 식별된 후보는 execute를 생략할 수 있다. 목적지 guard는 모두 유지한다.
      plan:
        entry_states: [OPEN]
        requires: [admitted]
        roles: [coordinator, specifier, designer, planner]
        allow: [read, record, plan]
        calls: [human-gate]
        next: [execute, verify]
      execute:
        entry_states: [OPEN]
        roles: [executor, specifier, designer]
        allow: [read, record, edit]
        requires: [admitted, plan_current, gate_satisfied]
        next: [verify]
      verify:
        entry_states: [OPEN, VERIFIED]
        roles: [verifier]
        allow: [read, record, verify, review]
        requires: [admitted, plan_current, gate_satisfied, candidate_ready]
        calls: [verification, independent-review]
        complete_when: [evidence_current, independent_satisfied]
        sets: VERIFIED
        next: [accept]
        reuse: 이미 현재 후보에 적용 가능한 근거가 있으면 재실행하지 않고 적용성을 대조한다.
      accept:
        entry_states: [VERIFIED]
        roles: [coordinator, reviewer]
        allow: [read, record, review, accept]
        requires: [evidence_current, independent_satisfied, parent_reconciled]
        complete_when: [accepted_current]
        sets: ACCEPTED
        next: [close]
      close:
        entry_states: [ACCEPTED]
        roles: [integrator, steward]
        allow: [read, record, integrate]
        requires: [accepted_current]
        complete_when: [delivery_current, settled]
        sets: CLOSED
        next: []
        note: policies.git_closeout 조건에 맞는 Git 작업은 그 절차를 기본 적용한다. 그 외에는 기존 delivery 의무를 따른다. 전달이 불필요하면 이유를 적는다. steward는 integrate 권한이 없다.
      recover:
        entry_states: [OPEN, VERIFIED, ACCEPTED]
        roles: [coordinator, planner]
        allow: [read, record, plan]
        calls: [recovery]
        complete_when: [recoverable]
        next: [admit, plan, execute, verify, accept, close]
    interruption:
      to: recover
      note: 실패·중단 시 현재 노드를 resume_node에 보존하고 recover로 간다. 원결과·소비·현재 lifecycle은 보존하고 영향받은 claim만 OPEN으로 철회한다.
    transition_rule: 현재 complete_when을 확인해 sets를 적용한 뒤 next와 목적지 entry_states/requires를 확인한다. 중단 전이는 complete_when 실패 중에도 가능하지만 제품 효과는 허용하지 않는다.
    call_rule: workflow.node는 상위노드/subgraph/step 경로로 현재 호출을 식별한다. calls에 열거된 subgraph의 roles와 steps만 사용하고 종료 후 상위로 복귀한다. 상위 allow가 호출 권한의 상한이며 역할 변경은 명시적으로 기록한다.
    preparation: admit의 불완전 Packet 준비는 현재 사용자가 위임한 설정/자기 기록 범위 안에서만 허용한다. policies.bootstrap 조건이면 현재 요청으로 설정/Packet을 채워 admitted를 충족하고 정본 문서 쓰기는 execute에서 수행한다. 비어 있는 예시는 제품 효과의 권한이 아니다. requires가 실패하면 해당 노드의 효과를 실행하지 않는다.
    reopening: CLOSED 기록은 자동 재개하지 않는다. 새 사용자 작업으로 연결한다. recover의 복귀도 목적지 guard와 lifecycle 조건을 생략하지 않는다.

subgraphs:
  verification:
    when: 검증 의무가 있고 현재 적용 가능한 근거가 부족하다.
    roles: [verifier]
    allow: [read, record, verify]
    steps: [select_obligations, observe, assess_applicability]
    input: criteria·candidate·허용 검사/자료·관련 음성/교차 조건과 context.applicability의 점검 결과. select_obligations에서 현재 scope/정본 판본에 대한 적용성과 누락/미해결을 대조하며 유효한 기존 점검은 재사용한다.
    output: 기준별 원근거·대상·판정·미검증 범위; 전체 verification.verdict
    failure: 제품 위반은 fail, 준비/관찰 부족은 inconclusive 또는 not_run으로 보존한다. recovery로 필요한 범위만 넘긴다.
  independent-review:
    when: policies.independence_default 또는 프로젝트/작업의 추가 독립성 요구에 해당한다.
    roles: [reviewer]
    allow: [read, record, review]
    steps: [bound_context, judge, record]
    input: 현재 후보·기준·필요 원자료/실제 결과; 생성자 자기점수/설득·다른 시도 결론은 초기 맥락에서 제외
    output: decisions의 independent_review와 independence의 분리 방법·근거
    failure: 생성/수정 맥락 그대로의 자기평가는 불가하다. 실제 맥락 분리가 불가능하면 상향 판단하고 충족으로 기록하지 않는다.
  human-gate:
    when: baseline tag·프로젝트 추가 tag 또는 기존 위임 밖의 범위/기준/권한 변경이다. policies.bootstrap.baseline의 최초 사용자 requirement 기록은 canonical_requirement 변경에서 제외한다.
    roles: [coordinator, planner]
    allow: [read, record, plan]
    steps: [prepare_brief, await_human, bind_decision]
    input: plan.identity·변경/이유/인간 확인 사항/잔여 위험
    output: 실제 인간 응답을 위치/문맥과 함께 decisions.human_gate에 기록
    failure: 거절/미확보이면 해당 변경은 미실행이다. 계획이 달라지면 승인 적용성을 다시 판단한다.
    projections: [ELI5, technical_walkthrough, diff_walkthrough, evidence_walkthrough, approving_scope]
    note: 질문은 policies.decision_questions를 따른다. 설명 투영은 계획·기준을 바꾸지 않는다. 필요한 원문이 바뀌면 새 plan.identity로 취급한다.
  recovery:
    when: 실패·중단·효과 불명확·한도/권한/격리 부족
    roles: [coordinator, planner]
    allow: [read, record, plan]
    steps: [reconcile_execution, bound_rework, resume_or_escalate]
    input: 원결과·현재 후보·attempts·남은 한도·의존 범위
    output: recovery.status/reason/resume_node와 이전 시도에 연결된 새 계획 또는 좁힌 인간 질문
    failure: 비멱등 효과가 불명확하면 자동 중복 실행하지 않는다. 한도 소진·반복 미해결은 상향 판단한다.
    note: recoverable을 충족해야 목적지 guard를 다시 확인해 복귀한다. 코드 수정은 execute에서만 한다.

context:
  relations: [references, governed_by, implements, verifies]
  seed: 현재 역할·노드·Task Packet·인수 기준·관련 manifest
  retrieval: [id_metadata, summary_heading, excerpt, full_artifact]
  projection:
    input: 프로젝트 정본의 명시적 ID/참조와 판본·선택 위치
    output: Packet artifacts에 task-local 노드·edge·출처를 도출; 전역 저장은 불필요
    selection: 계획의 산출물/근거 ID에서 직접 연결된 필요한 이웃을 우선 선택한다. plan/criteria 확정 전 context.applicability로 비연결 공통 의무도 대조하며 자료 선택과 edge 도출을 구분한다.
    constraints:
      - edge는 해당 artifact.id/revision 및 links.source_selector가 가리키는 원본의 명시 참조에서만 만든다. 자연어 추론으로 type을 부여하지 않는다.
      - 원본의 판본이 달라지면 맵을 다시 도출한다. unresolved는 기록하고 필요한 claim을 보류한다.
      - 관계는 자료 회수 단서일 뿐 권한·실행 순서·검증 PASS를 부여하지 않는다.
      - 자료는 이 프로젝트 안에서 해결한다. 맵에 외부 계약 개발 자료를 넣지 않는다.
      - Artifact Graph 연결이나 task-local manifest 항목의 부재를 requirement·security·architecture constraint의 부재로 판단하지 않는다.
  applicability:
    when: plan/criteria와 검증 의무를 확정하기 전 현재 변경 유형·scope에 적용 가능한 project-wide governing 정본을 bounded check한다. 같은 scope/정본 판본의 유효한 기록은 재사용하고 변경 시 영향 범위만 다시 확인한다.
    discovery: project.artifact_roots 안의 허가된 자료에서 현재 정본 목차/목록·ID·제목·짧은 적용 범위부터 확인한다. 기존 목록이 없거나 불충분하면 관련 경로·제목을 한정 탐색한다. 점검한 위치/판본·범위를 남기며 전체 history·전체 graph·모든 requirement 전문을 기본 회수하지 않는다.
    selection: 프로젝트 공통 요구, 인증/인가, 소유권/접근 제어, 보안/개인정보, architecture, 데이터 무결성/저장 규칙 및 프로젝트가 지정한 의무를 현재 변경과 대조한다. 이는 탐색 예시이며 고정 taxonomy가 아니다. metadata/heading으로 무관함이 충분하면 멈추고 적용 가능성이 있는 자료의 관련 절, 정말 필요할 때만 전체 artifact를 읽는다.
    record: plan.summary에 점검 범위·선택/제외 이유·unresolved를 간결히 남긴다. 실제 회수한 관련 자료는 artifacts와 plan.artifacts에 넣고 적용 의무는 criteria에 반영한다. 추정 적용성은 선택 이유이지 정본 edge가 아니며 명시 참조가 없으면 links를 추가하지 않는다.
    unresolved: 적용 가능성이 높은 정본을 찾지 못하거나 접근 불가/적용성 불명이면 plan.summary와 의존 criteria에 unresolved 및 필요한 회수/판단을 남긴다. 없는 artifact 판본·edge·PASS 근거를 만들지 않는다. 해당 계획 완전성·검증 claim·VERIFIED는 보류하고 verification은 not_run 또는 inconclusive로 기록한다. 필요한 경우 기존 recovery로 차단 이유와 좁은 다음 행동을 남긴다.
    authority: scope.read 밖 접근은 허용하지 않는다. 기존 의무의 회수/반영만으로 Human Gate를 추가하지 않으며 실제 requirement·architecture·security 등의 변경에 기존 gate를 적용한다. 불충분한 탐색을 무관함으로 처리하거나 사용자 승인만으로 미확보 근거를 PASS로 바꾸지 않는다.
  telemetry: 노출된 실제 input/cache/output만 범위·단위와 기록한다. 미노출 값을 추정하지 않으며 별도 계측 파일을 요구하지 않는다.

distribution:
  identity: distribution.yaml의 content_id는 출하 당시 payload 경로와 바이트 해시의 결정적 식별자다. 자기 파일은 해시 대상에서 제외한다. 복사 후 project.yaml 설정/AGENTS 병합은 별도 로컬 변경이며 출하 manifest를 재작성하지 않는다.
  boundary: 복사본 안의 현재 계약으로 실행 의미를 이해할 수 있어야 한다. 외부 개발 자료·역사·절대/상위 탈출 경로를 참조하지 않는다.
  customization: project.yaml에서 자료 루트·역할 권한 축소·추가 gate·런타임 경계를 설정한다. Core는 직접 덮어 고치지 않는다.
  update: 명시적 작업·변경 비교·권한 확인 뒤 snapshot을 교체한다. 활성 Packet은 이전 식별을 유지하거나 영향/승인 대조 후 명시적으로 전환한다.
  copy: 기존 파일과 충돌하면 자동 덮어쓰지 않는다. 프로젝트 설정과 활성 작업 기록은 새 기본값으로 덮지 않는다.

validation_contract:
  implemented_by_export: [payload_allowlist, no_links_or_escape, no_source_locators, local_bundle_links, deterministic_identity]
  deferred_semantic_checks:
    - schemas 형식, role/node/subgraph/guard 참조, graph 전이의 유효성
    - 역할 특화·노드·작업의 권한 확대/금지 경로
    - 미해결 산출물 참조와 판본/적용성 누락
    - 근거 없는 VERIFIED/ACCEPTED/CLOSED 및 인간 gate 우회
    - 모든 acceptance의 producer actor 중복/재명명 우회 및 필수 독립 판단의 맥락 분리 근거 누락
    - 전달 대상 변경에 따른 claim 재적용과 중단 후 중복 실행
  limit: 형식·연결 검사는 진실한 인간 승인·의미적 정확성·OS 격리를 입증하지 못한다. 실제 원근거/런타임 대조가 필요하다.

# JSON Schema draft-07의 공통 부분집합이다. 모든 $ref는 이 schema 내부에서 해결한다.
# default는 실행 값이 아니다. 예시와 초기 미완료 값은 admit guard에서 보완해야 한다.
schemas:
  dialect: json-schema-draft-07
  document:
    oneOf:
      - {$ref: '#/definitions/project'}
      - {$ref: '#/definitions/task'}
    definitions:
      text: {type: string, minLength: 1}
      texts: {type: array, items: {$ref: '#/definitions/text'}, uniqueItems: true}
      path:
        type: string
        minLength: 1
        pattern: '^(?!/)(?!.*\\)(?!.*:)(?!.*(?:^|/)\.\.?(?:/|$))(?!.*[\$*?\[\]])(?!~)(?!.*//).+$'
      paths: {type: array, items: {$ref: '#/definitions/path'}, uniqueItems: true}
      actor:
        type: object
        additionalProperties: false
        required: [id, kind, context]
        properties:
          id: {$ref: '#/definitions/text'}
          kind: {enum: [human, agent]}
          context: {$ref: '#/definitions/text'}
      role:
        type: object
        additionalProperties: false
        required: [base, allow, deny]
        properties:
          base: {$ref: '#/definitions/text'}
          allow: {$ref: '#/definitions/texts'}
          deny: {$ref: '#/definitions/texts'}
      project:
        type: object
        additionalProperties: false
        required: [kind, schema_version, project_id, artifact_roots, task_root, extra_human_gate_tags, role_specializations, runtime]
        properties:
          kind: {const: project}
          schema_version: {const: 1}
          project_id: {type: [string, 'null']}
          artifact_roots: {$ref: '#/definitions/paths'}
          task_root: {$ref: '#/definitions/path'}
          extra_human_gate_tags: {$ref: '#/definitions/texts'}
          role_specializations:
            type: object
            additionalProperties: {$ref: '#/definitions/role'}
          runtime:
            type: object
            additionalProperties: false
            required: [name, access_boundary, judgment_boundary]
            properties:
              name: {type: [string, 'null']}
              access_boundary: {type: [string, 'null']}
              judgment_boundary: {type: [string, 'null']}
      artifact:
        type: object
        additionalProperties: false
        required: [id, path, revision, selector, kind]
        properties:
          id: {$ref: '#/definitions/text'}
          path: {$ref: '#/definitions/path'}
          revision: {$ref: '#/definitions/text'}
          selector: {$ref: '#/definitions/text'}
          kind: {enum: [requirement, decision, plan, code, test, evidence, document, task]}
          summary: {type: string}
          links:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [relation, to, source_selector]
              properties:
                relation: {enum: [references, governed_by, implements, verifies]}
                to: {$ref: '#/definitions/text'}
                source_selector: {$ref: '#/definitions/text'}
      evidence:
        type: object
        additionalProperties: false
        required: [id, artifact, subject, criteria, availability, verdict, applicability]
        properties:
          id: {$ref: '#/definitions/text'}
          artifact: {$ref: '#/definitions/text'}
          subject: {$ref: '#/definitions/text'}
          criteria: {$ref: '#/definitions/texts'}
          availability: {enum: [available, unavailable]}
          verdict: {enum: [not_run, pass, fail, inconclusive]}
          applicability: {$ref: '#/definitions/text'}
      decision:
        type: object
        additionalProperties: false
        required: [kind, actor, role, subject, verdict, basis, independence]
        properties:
          kind: {enum: [human_gate, independent_review, acceptance]}
          actor: {$ref: '#/definitions/actor'}
          role: {$ref: '#/definitions/text'}
          subject: {$ref: '#/definitions/text'}
          verdict: {enum: [approved, accepted, pass, rejected, deferred]}
          basis: {$ref: '#/definitions/text'}
          independence: {type: [string, 'null']}
      attempt:
        type: object
        additionalProperties: false
        required: [id, action, state, receipt]
        properties:
          id: {$ref: '#/definitions/text'}
          action: {$ref: '#/definitions/text'}
          state: {enum: [not_started, running, finished, unknown]}
          receipt: {type: [string, 'null']}
      task:
        type: object
        additionalProperties: false
        required: [kind, schema_version, id, objective, harness_snapshot, workflow, scope, criteria, plan, artifacts, candidate, verification, decisions, delivery, recovery]
        properties:
          kind: {const: task}
          schema_version: {const: 1}
          id: {$ref: '#/definitions/text'}
          objective: {$ref: '#/definitions/text'}
          harness_snapshot: {type: [string, 'null']}
          workflow:
            type: object
            additionalProperties: false
            required: [graph, node, role, actor, state]
            properties:
              graph: {$ref: '#/definitions/text'}
              node: {$ref: '#/definitions/text'}
              role: {$ref: '#/definitions/text'}
              actor: {$ref: '#/definitions/actor'}
              state: {enum: [OPEN, VERIFIED, ACCEPTED, CLOSED]}
          scope:
            type: object
            additionalProperties: false
            required: [authorization, read, write, allow, deny, risk_tags, risk_reason, children]
            properties:
              authorization: {type: [string, 'null']}
              read: {$ref: '#/definitions/paths'}
              write: {$ref: '#/definitions/paths'}
              allow: {$ref: '#/definitions/texts'}
              deny: {$ref: '#/definitions/texts'}
              risk_tags: {$ref: '#/definitions/texts'}
              risk_reason: {type: [string, 'null']}
              children: {$ref: '#/definitions/texts'}
          criteria:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [id, requirement, check]
              properties:
                id: {$ref: '#/definitions/text'}
                requirement: {$ref: '#/definitions/text'}
                check: {$ref: '#/definitions/text'}
          plan:
            type: object
            additionalProperties: false
            required: [identity, summary, artifacts, review_brief]
            properties:
              identity: {type: [string, 'null']}
              summary: {type: [string, 'null']}
              artifacts: {$ref: '#/definitions/texts'}
              review_brief:
                oneOf:
                  - {type: 'null'}
                  - type: object
                    additionalProperties: false
                    required: [what, why, human_check, residual_risks]
                    properties:
                      what: {$ref: '#/definitions/text'}
                      why: {$ref: '#/definitions/text'}
                      human_check: {$ref: '#/definitions/text'}
                      residual_risks: {$ref: '#/definitions/texts'}
          artifacts: {type: array, items: {$ref: '#/definitions/artifact'}}
          candidate:
            oneOf:
              - {type: 'null'}
              - type: object
                additionalProperties: false
                required: [id, artifacts, producers]
                properties:
                  id: {$ref: '#/definitions/text'}
                  artifacts: {$ref: '#/definitions/texts'}
                  producers: {type: array, minItems: 1, items: {$ref: '#/definitions/actor'}}
          verification:
            type: object
            additionalProperties: false
            required: [verdict, independence_required, independence_reason, evidence]
            properties:
              verdict: {enum: [not_run, pass, fail, inconclusive]}
              independence_required: {type: boolean}
              independence_reason: {type: [string, 'null']}
              evidence: {type: array, items: {$ref: '#/definitions/evidence'}}
          decisions: {type: array, items: {$ref: '#/definitions/decision'}}
          delivery:
            type: object
            additionalProperties: false
            required: [required, target, receipt, applicability, residual_risks]
            properties:
              required: {type: boolean}
              target: {type: [string, 'null']}
              receipt: {type: [string, 'null']}
              applicability: {type: [string, 'null']}
              residual_risks: {$ref: '#/definitions/texts'}
          recovery:
            type: object
            additionalProperties: false
            required: [status, max_attempts, attempts, reason, resume_node]
            properties:
              status: {enum: [clear, blocked]}
              max_attempts: {type: [integer, 'null'], minimum: 1}
              attempts: {type: array, items: {$ref: '#/definitions/attempt'}}
              reason: {type: [string, 'null']}
              resume_node: {type: [string, 'null']}

packet_semantics:
  snapshot: harness_snapshot은 출하 content_id이며 실제 core.yaml은 그 파일 해시와 일치해야 한다. 로컬 설정/지침의 현재 판본과 의미적 호환성도 plan.artifacts에서 식별·대조한다. 설정 변경으로 이전 권한·계획이 자동 유효해지지 않는다.
  incomplete: null과 빈 배열은 준비 상태를 표현한다. 형식 통과가 admit 통과는 아니다. 실제 위임·목적·기준·계획·경계를 채워야 실행할 수 있다.
  next_action: workflow.node의 단계·guard와 현재 판정에서 다음 허용 행동을 도출한다. 별도 next_action 필드를 중복 관리하지 않는다.
  paths: 프로젝트 루트 기준 정확한 파일/디렉터리 상대 경로다. 디렉터리는 그 아래만 포함하고 symlink의 실제 대상도 경계 안이어야 한다. glob·URL·절대/상위 탈출 경로는 허용하지 않는다.
  manifest: 각 항목의 id는 Packet 안에서 유일하고 실제 프로젝트 자료의 회수 가능한 판본을 식별한다. 프로젝트 자료 경로는 artifact_roots 또는 task_root 안에 둔다. AGENTS.md와 .harness의 계약/설정/배포 식별 파일은 내장 로컬 참조다. 이 경로 분류가 scope.read 밖의 접근을 허가하지는 않는다. 새 출력은 계획의 쓰기 범위로 선언하고 생성 후 manifest에 넣는다.
  references: plan.artifacts·candidate.artifacts·evidence.artifact·links.to·children는 manifest ID로 해결한다. subject는 현재 계획/후보 ID 또는 내부에 보존된 이전 식별로 해결한다. 무효·유실 근거는 상태 승격에 사용하지 않는다.
  records: authorization·decision.basis·attempt.receipt·delivery.receipt는 프로젝트 내부 artifact ID 또는 Packet 안의 실제 발언/관찰과 회수 위치 설명이다. 없는 메시지 ID를 만들지 않는다.
  actors: actor.id는 실제 실행/판단 주체의 안정된 식별자다. role/context와 독립적으로 동일성을 유지하며 producer를 누락하거나 이름만 바꿔 인수 제한을 우회하지 않는다. 적격 비producer가 없으면 acceptance를 보류하고 필요한 인수만 요청한다.
  identity: plan.identity는 scope·criteria·계획·효과·위험의 고정 내용을 식별한다. candidate.id는 artifact ID/판본 집합을 식별한다. 내용 변경 뒤 같은 ID로 덮지 않는다.
  plan_change: 계획 범위·기준·위험·효과를 바꾸면 새 식별과 인간 승인 적용성 판단이 필요하다. 동일한 기존 승인의 재사용도 구체 이유를 보존한다.
  evidence: subject는 실행 당시 후보 ID다. 현재와 다르면 applicability에 두 후보의 차이·영향·재사용 가능한 기준 범위와 근거를 적는다. 원판정은 유지한다.
  decisions: human_gate는 인간 actor/role=human과 plan.identity에 approved, independent_review는 reviewer와 candidate.id에 pass, acceptance는 candidate.producers의 어떤 actor도 아닌 주체(위임된 coordinator/reviewer 또는 인간)가 candidate.id에 내린 accepted만 성공이다. 비producer인 적격 reviewer의 인수를 재사용할 수 있으며 별도 acceptor를 더 요구하지 않는다.
  independence: acceptance는 항상 producer와 다른 실제 actor가 맡고 같은 모델 사용은 허용한다. 추가 독립 판단이 필요한 경우에는 bounded context의 실제 분리 근거도 필요하다. 역할 전환·새 ID·새 세션 이름만으로 다른 actor나 분리를 주장하지 않는다. 검토자가 수정하면 producers에 포함하고 다른 적격 actor가 인수한다.
  children: children는 task artifact ID이며 각 하위 인수/후보를 회수한다. 상위 결합 영향과 잔여 의무 대조를 acceptance.basis에 남긴다.
  residual: 잔여 위험은 이유·소유자·후속 조건을 포함한다. 필수 blocker를 단순 위험으로 옮겨 종료하지 않는다.
  delivery: target은 동일하면 candidate.id, 다르면 실제 전달 판본/구성 목록을 식별하는 manifest ID다. receipt와 applicability로 인수 대상과 관계를 설명한다. 전달 불필요면 required=false의 이유를 적는다. 영향 변경이면 OPEN으로 돌아가 재검증/필요 재인수한다.
  attempts: max_attempts는 시도 총수의 작업별 유한 상한이다. 계획에서 실행·검증/재작업 단위에 맞춰 정하며 기존 소비를 지우거나 자동 증액하지 않는다. 한 attempt는 계획에서 정한 의미 있는 실행/재작업 단위이며 모든 읽기 명령을 별도 세지 않는다. 시작 전에 기록하고 불명확한 소비도 한도에 포함한다. 불확실한 비멱등 효과를 다시 실행하지 않는다.
  preservation: 이전 후보·근거·판정은 배열 또는 프로젝트 내부의 회수 가능한 불변 판본으로 보존한다. 현재 Packet의 요약만으로 유실 근거를 대체하지 않는다.
